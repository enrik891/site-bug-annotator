<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Bug Annotator</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="appHeader">
    <div class="brand">
      <img class="appIcon" src="icons/icon32.png" alt="">
      <div class="brandText">
        <div class="titleRow">
          <h1>Site Bug Annotator</h1>
          <span id="appVersion" class="lozenge lozenge-neutral">v—</span>
        </div>
        <div class="siteRow" title="Progetto corrente">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
          <span id="siteName">Caricamento…</span>
        </div>
      </div>
    </div>
    <button id="toggleMode" class="btn btn-primary" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span id="toggleModeLabel">Segnala</span>
    </button>
  </header>

  <section class="panel controls" aria-label="Impostazioni vista">
    <div class="controlRow">
      <label class="toggle" for="toggleVisibility">
        <input id="toggleVisibility" type="checkbox" role="switch" checked>
        <span class="toggleTrack" aria-hidden="true"><span class="toggleThumb"></span></span>
        <span id="visibilityLabel" class="toggleLabel">Pin visibili</span>
      </label>
      <span id="modeHint" class="lozenge lozenge-neutral">Consultazione</span>
    </div>

    <div class="field">
      <label class="fieldLabel" for="devicePreset">Vista dispositivo</label>
      <div class="selectWrap">
        <svg class="icon icon-sm selectIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <select id="devicePreset">
          <option value="off">Normale (finestra corrente)</option>
          <option value="desktop1440">Desktop · 1440 × 900</option>
          <option value="tablet768">Tablet · 768 × 1024</option>
          <option value="mobile390">Mobile · 390 × 844</option>
        </select>
        <svg class="icon icon-sm selectChevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <span id="deviceStatus" class="helperText">La pagina usa la larghezza reale della finestra</span>
    </div>
  </section>

  <nav class="tabs statusFilters" aria-label="Filtro stato" role="tablist">
    <button type="button" role="tab" data-filter="all" class="active">Tutte <span class="badge" data-count="all">0</span></button>
    <button type="button" role="tab" data-filter="todo">Da fare <span class="badge" data-count="todo">0</span></button>
    <button type="button" role="tab" data-filter="done">Fatte <span class="badge" data-count="done">0</span></button>
  </nav>

  <nav id="deviceFilters" class="segmented" aria-label="Filtro dispositivo">
    <button type="button" data-device-filter="all">Tutti</button>
    <button type="button" data-device-filter="desktop" class="active">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Desktop
    </button>
    <button type="button" data-device-filter="tablet">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg>Tablet
    </button>
    <button type="button" data-device-filter="mobile">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>Mobile
    </button>
  </nav>

  <main>
    <div id="empty" class="emptyState" hidden>
      <svg class="emptyArt" viewBox="0 0 120 96" aria-hidden="true">
        <rect x="14" y="14" width="92" height="64" rx="8" class="artSurface"/>
        <rect x="14" y="14" width="92" height="14" rx="8" class="artBar"/>
        <circle cx="24" cy="21" r="2.5" class="artDot"/><circle cx="32" cy="21" r="2.5" class="artDot"/><circle cx="40" cy="21" r="2.5" class="artDot"/>
        <rect x="26" y="38" width="44" height="6" rx="3" class="artLine"/>
        <rect x="26" y="50" width="62" height="6" rx="3" class="artLine"/>
        <rect x="26" y="62" width="34" height="6" rx="3" class="artLine"/>
        <circle cx="92" cy="40" r="11" class="artPin"/>
        <path d="M92 35v10M87 40h10" class="artPinPlus"/>
      </svg>
      <h2 id="emptyTitle">Nessuna segnalazione</h2>
      <p id="emptyText">Premi <strong>Segnala</strong> e clicca un elemento della pagina per aggiungere la prima nota.</p>
    </div>
    <div id="list" class="list"></div>
  </main>

  <footer class="appFooter">
    <button id="exportBtn" class="btn btn-subtle" type="button">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Esporta
    </button>
    <label class="btn btn-subtle fileBtn">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>Importa
      <input id="importInput" type="file" accept="application/json,.json">
    </label>
  </footer>

  <dialog id="confirmDialog" class="modal modal-sm" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="modalHeader">
        <svg id="confirmIcon" class="icon icon-lg iconDanger" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
        <h2 id="confirmTitle">Conferma</h2>
      </div>
      <div class="modalBody"><p id="confirmText"></p></div>
      <div class="modalFooter">
        <button class="btn btn-subtle" value="cancel" type="submit">Annulla</button>
        <button id="confirmOk" class="btn btn-danger" value="ok" type="submit">Conferma</button>
      </div>
    </form>
  </dialog>

  <div id="flags" class="flags" aria-live="polite"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
